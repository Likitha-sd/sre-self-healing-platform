apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "fastapi"
        metrics_path: "/metrics"
        static_configs:
          - targets:
              - "fastapi-service.default.svc.cluster.local:8000"
